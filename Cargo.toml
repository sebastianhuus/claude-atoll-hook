[package]
name = "claude-atoll-hook"
version = "0.1.0"
edition = "2021"
description = "Drop-in replacement for claude-atoll-state.py — sends hook events to ClaudeAtoll.app via Unix socket"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
